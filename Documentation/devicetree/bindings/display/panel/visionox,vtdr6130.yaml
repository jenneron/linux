%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/visionox,vtdr6130.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Visionox VTDR6130 AMOLED DSI Panel

maintainers:
  - Neil Armstrong <neil.armstrong@linaro.org>

properties:
  compatible:
    oneOf:
      - const: visionox,vtdr6130
      - description: RetroidPocket panels with the VTDR6130 driver IC
        enum:
          - retroidpocket,rp5-visionox-panel
          - retroidpocket,rp6-panel
          - retroidpocket,rpduo-panel-top
          - retroidpocket,rpflip2-visionox-panel

  reg:
    maxItems: 1
    description: DSI virtual channel

  vddio-supply: true
  vci-supply: true
  vdd-supply: true
  vdd18-supply:
    description: 1.8V supply of the panel module
  vdd28-supply:
    description: 2.8V supply of the panel module
  vdd1v2-supply:
    description: 1.2V supply of the panel module
  avdd-supply:
    description: analog supply of the panel module
  port: true
  reset-gpios: true
  rotation: true

required:
  - compatible
  - reg
  - vddio-supply
  - vdd-supply
  - reset-gpios
  - port

allOf:
  - $ref: panel-common.yaml#
  - if:
      properties:
        compatible:
          contains:
            const: visionox,vtdr6130
    then:
      properties:
        vdd18-supply: false
        vdd28-supply: false
  - if:
      properties:
        compatible:
          contains:
            enum:
              - retroidpocket,rp5-visionox-panel
              - retroidpocket,rpflip2-visionox-panel
    then:
      properties:
        vci-supply: false
        vdd18-supply: false
        vdd28-supply: false
      required:
        - vdd1v2-supply
        - avdd-supply
    else:
      properties:
        vdd1v2-supply: false
        avdd-supply: false
      required:
        - vci-supply

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    dsi {
        #address-cells = <1>;
        #size-cells = <0>;
        panel@0 {
            compatible = "visionox,vtdr6130";
            reg = <0>;

            vddio-supply = <&vreg_l12b_1p8>;
            vci-supply = <&vreg_l13b_3p0>;
            vdd-supply = <&vreg_l11b_1p2>;

            reset-gpios = <&tlmm 133 GPIO_ACTIVE_LOW>;

            port {
                panel0_in: endpoint {
                    remote-endpoint = <&dsi0_out>;
                };
            };
        };
    };
...
