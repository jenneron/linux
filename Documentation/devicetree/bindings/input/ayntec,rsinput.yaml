%YAML 1.2
---
$id: http://devicetree.org/schemas/input/ayntec,rsinput.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: RSInput UART gamepad controller

maintainers:
  - Teguh Sobirin <teguh@sobir.in>

description:
  Gamepad microcontroller found in AYN and Retroid Pocket handhelds. It is
  attached to a UART running at 115200 baud and reports the buttons, the two
  analog sticks and the two triggers in periodic status frames.

allOf:
  - $ref: /schemas/serial/serial-peripheral-props.yaml#

properties:
  compatible:
    enum:
      - ayntec,rsinput
      - retroidpocket,rsinput

  vdd-supply:
    description: MCU power supply.

  enable-gpios:
    maxItems: 1
    description: GPIO enabling the MCU.

  reset-gpios:
    maxItems: 1
    description: GPIO connected to the MCU reset line.

  boot-gpios:
    maxItems: 1
    description: GPIO selecting the MCU boot mode, driven low for normal boot.

  gamepad-name:
    $ref: /schemas/types.yaml#/definitions/string
    description: Name of the input device.

  gamepad-bus:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Bus type reported in the input device ID.

  gamepad-vid:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Vendor ID reported in the input device ID.

  gamepad-pid:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Product ID reported in the input device ID.

  gamepad-rev:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Version reported in the input device ID.

  invert-x:
    type: boolean
    description: Invert the left stick X axis.

  invert-y:
    type: boolean
    description: Invert the left stick Y axis.

  invert-rx:
    type: boolean
    description: Invert the right stick X axis.

  invert-ry:
    type: boolean
    description: Invert the right stick Y axis.

  axis-range:
    $ref: /schemas/types.yaml#/definitions/uint32
    default: 0x580
    description:
      Stick travel in raw units. Every stick axis is reported in the range
      -axis-range to +axis-range.

  trigger-left-deadzone:
    $ref: /schemas/types.yaml#/definitions/uint32
    default: 0
    description: Raw left trigger travel reported as released.

  trigger-right-deadzone:
    $ref: /schemas/types.yaml#/definitions/uint32
    default: 0
    description: Raw right trigger travel reported as released.

  digital-triggers:
    type: boolean
    description:
      The triggers are switches. Report them as buttons instead of axes.

  auto-center:
    type: boolean
    description:
      Take the stick positions in the first status frame as the centers,
      for MCUs that report a non-zero position at rest.

  mcu-watchdog:
    type: boolean
    description:
      Probe the MCU link periodically, and reopen the UART and then
      power-cycle the MCU when it stops answering.

required:
  - compatible
  - vdd-supply

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    serial {
        gamepad {
            compatible = "ayntec,rsinput";

            gamepad-name = "AYN Odin2 Gamepad";
            gamepad-bus = <0x0003>;
            gamepad-vid = <0x2020>;
            gamepad-pid = <0x3001>;
            gamepad-rev = <0x0001>;

            vdd-supply = <&vdd_mcu_3v3>;
            enable-gpios = <&tlmm 12 GPIO_ACTIVE_HIGH>;

            axis-range = <1024>;
            invert-x;
            invert-y;
            trigger-left-deadzone = <100>;
            trigger-right-deadzone = <100>;
        };
    };
